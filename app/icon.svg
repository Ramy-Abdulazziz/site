<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" role="img" aria-label="رامى" shape-rendering="crispEdges">
  <style>
    .bg { fill: #0b0b0c; }
    .ink { fill: #ededef; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f5f3ee; }
      .ink { fill: #151515; }
    }
  </style>
  <!--
    رامى in square Kufic on a 9×9 grid, right to left.
    ر is the top-right hook and does not touch ا.
    ا is the tall stroke and does not touch م.
    م joins ى along the baseline. ى has two teeth and no dots.
    Columns 0–8, rows 0–8:
      r0 ........#
      r1 ........#
      r2 .......#.
      r3 .........
      r4 .......#.
      r5 .......#.
      r6 #.#.##.#.
      r7 ######.#.
      r8 ....#..#.
  -->
  <rect class="bg" width="9" height="9"/>
  <g class="ink">
    <rect x="8" y="0" width="1" height="1"/>
    <rect x="8" y="1" width="1" height="1"/>
    <rect x="7" y="2" width="1" height="1"/>
    <rect x="7" y="4" width="1" height="1"/>
    <rect x="7" y="5" width="1" height="1"/>
    <rect x="0" y="6" width="1" height="1"/>
    <rect x="2" y="6" width="1" height="1"/>
    <rect x="4" y="6" width="1" height="1"/>
    <rect x="5" y="6" width="1" height="1"/>
    <rect x="7" y="6" width="1" height="1"/>
    <rect x="0" y="7" width="6" height="1"/>
    <rect x="7" y="7" width="1" height="1"/>
    <rect x="4" y="8" width="1" height="1"/>
    <rect x="7" y="8" width="1" height="1"/>
  </g>
</svg>
